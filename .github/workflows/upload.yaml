name: Validate and upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install dependencies
        run: caps --strict --ci && yarn install --immutable

      - name: Verify Calcit runtime toolchain
        run: caps verify --toolchain

      - name: Validate Calcit snapshot and types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          yarn check-client
          yarn check-server
          calcit calcit.cirru fix --workflow strict --verify --format edn
          calcit calcit.cirru --entry server test --require-match --summary-only
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

      - name: Build browser client with CDN paths
        id: assets
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"; else prefix="${GITHUB_REPOSITORY}/"; fi
          base_url="${CDN_ORIGIN}/${prefix}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          export VITE_BASE_URL="$base_url"
          yarn compile-page
          yarn release-page

      - name: Upload frontend to COS and verify public files
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.assets.outputs.prefix }}
          public-base-url: ${{ steps.assets.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
          verify-attempts: 6

      - run: mkdir -p dist-server && cp calcit.cirru deps.cirru package.json dist-server/
        name: Copy server scripts

      - name: Upload web assets
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"

      - name: Upload server script
        id: deploy-server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist-server/*"
          dest: "rsync-user@tiye.me:/servers/paste-sharing/"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy-server.outputs.status }}"
